      '<p class="mt-3 border-t border-white/[0.08] pt-3 text-[12.5px] leading-[1.5] text-zinc-400">' + link('reopen', 'Reopen this case', '', 'rotate-ccw') + ' <span class="block pt-1">Reopening clears the decision and keeps its number.</span></p>';
  }

  function rail(s) {
    var CELL = 'min-w-0 scroll-mb-[calc(var(--gk-tour,0px)+1rem)] scroll-mt-16 px-5 pt-12 max-[899px]:w-full max-[899px]:max-w-[860px] max-[899px]:justify-self-center min-[900px]:col-start-2 min-[900px]:px-4 min-[900px]:pt-6 min-[900px]:[grid-row:1/span_12] min-[1280px]:col-start-3';
    var c = caseOf(s);
    if (!c) return '<aside data-region="rail" class="' + CELL + '"></aside>';
    var w = workOf(s, c.id);
    var v = verdictOf(c, w);
    var froz = frozen(w);
    var top = '<div class="flex items-center justify-between gap-3"><h2 id="h-rail" tabindex="-1" class="rounded text-[17px] font-semibold tracking-tight text-white">Decision</h2>' +
      (froz ? badge('ok', 'Committed', 'check') : (v ? badge('mute', 'Draft', 'pencil') : '')) + '</div>' + steps(s, c, w, v);
    var foot = '';
    if (froz) {
      top += decided(s, c, w);
    } else {
      // Every option is the same height chosen or not, so choosing one moves nothing.
      top += '<fieldset class="mt-3.5"><legend class="text-[12.5px] text-zinc-400">Verdict</legend><div class="mt-1.5 space-y-1.5">' + c.verdicts.map(function (x) {
        var on = w.verdict === x.id;
        var kd = K.pick(K.KIND, x.kind);
        return '<label class="flex cursor-pointer items-start gap-2.5 rounded-xl px-3 py-2 ring-1 ring-inset short:py-1.5 transition-[background-color,transform] duration-150 ease-out active:scale-[0.99] has-[:focus-visible]:outline has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-white motion-reduce:active:scale-100 ' + (on ? 'bg-white/[0.1] ring-white/45' : 'ring-white/[0.09] hover:bg-white/[0.05]') + '">' +
          '<input type="radio" name="verdict-' + esc(c.id) + '" value="' + esc(x.id) + '" data-act="verdict"' + (on ? ' checked' : '') + ' class="mt-[3px] h-4 w-4 shrink-0 accent-white focus-visible:outline-none">' +
          '<span class="min-w-0 flex-1"><span class="block text-[13.5px] font-medium leading-snug text-zinc-50">' + esc(x.label) +
          ' <span class="ml-0.5 inline-flex items-center gap-1 whitespace-nowrap align-[1px] text-[12px] font-medium ' + K.tone(kd.tone).text + '">' + ic(kd.icon, 'h-3 w-3') + esc(kd.label) + '</span></span>' +
          (s.hints && x.reference ? '<span class="mt-1.5 flex">' + badge('info', 'Reference path', 'eye') + '</span>' : '') + '</span></label>';
      }).join('') + '</div></fieldset>' +
        '<p class="mt-2.5 min-h-[3.4rem] text-[13px] leading-[1.45] ' + (v ? 'text-zinc-100' : 'text-zinc-400') + '">' + (v ? esc(v.effect) : 'Choose a verdict to see what it does.') + '</p>';
      var st = commitState(c, v, w);
      var pass = st.pc ? st.pc.items.filter(function (it) { return it.level === 'pass'; }).length : 0;
      var warns = st.pc ? st.pc.items.filter(function (it) { return it.level === 'warn'; }).length : 0;
      var go = fixAttrs(c, st.first);
      foot = '<p id="commit-reason" class="flex min-h-[2.3rem] gap-2 text-[12.5px] leading-[1.5] ' + (st.tone === 'mute' ? 'text-zinc-400' : K.tone(st.tone).text) + '">' + ic(st.icon, 'mt-[2px] h-3.5 w-3.5 shrink-0') + '<span class="min-w-0 [overflow-wrap:anywhere]">' + esc(st.text) + '</span></p>' +
        (st.pc ? '<p class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 pl-[22px] text-[12.5px] text-zinc-400">' +
          (go ? link('fix', 'Go to it', go, 'arrow-right') : '') +
          (warns ? '<span>' + warns + (warns === 1 ? ' warning' : ' warnings') + '</span>' : '') +
          '<span>' + pass + (pass === 1 ? ' check met' : ' checks met') + '</span>' + link('panel', 'See every check', dataAttr('panel', 'c-checks')) + '</p>' : '') +
        '<div class="mt-3">' + btn('commit', 'Commit decision', { primary: true, large: true, icon: 'stamp', disabled: !st.ok, why: 'commit-reason' }) + '</div>';
    }
    // The page's scroll padding already holds the top bar; under 900 px the bar scrolls away, so a negative margin brings the panel to the top when the walkthrough scrolls to it.
    // The panel is pinned when the viewport can hold it; if a state makes it taller, its upper part scrolls and the commit stays on screen.
    return '<aside data-region="rail" aria-labelledby="h-rail" class="' + CELL + '"><div class="min-[900px]:tall:sticky min-[900px]:tall:top-[calc(var(--gk-top,48px)+16px)]">' +
      '<div' + (ui(s).tour && ui(s).tour.focus === 'rail' ? ' data-ring="true"' : '') + ' class="flex max-[899px]:-scroll-mt-[calc(var(--gk-top,48px)+0.75rem)] flex-col rounded-2xl bg-gradient-to-b from-zinc-800/90 to-zinc-900 shadow-raised ring-1 ring-white/[0.14] data-[ring=true]:ring-2 data-[ring=true]:ring-sky-300/80 min-[900px]:tall:max-h-[calc(100vh-var(--gk-top,48px)-4.5rem-var(--gk-tour,0px))]">' +
      '<div class="min-h-0 px-4 pt-3.5 min-[900px]:tall:overflow-y-auto ' + (foot ? 'pb-1' : 'pb-4') + '">' + top + '</div>' +
      (foot ? '<div class="px-4 pb-4 pt-2">' + foot + '</div>' : '') + '</div>' +
      '<p class="mt-3 px-2 text-[12px] leading-5 text-zinc-400 max-[899px]:hidden">Simulation. Nothing here is sent or filed anywhere.</p></div></aside>';
  }

  // -- 03 What do we do?

  function checksRegion(s, c, v, w) {
    if (!v) return '<div data-region="c-checks"></div>';
    var pc = GK.core.policyChecks(c, v, w);
    function row(it) {
      return '<li class="grid grid-cols-1 gap-x-4 gap-y-1.5 px-4 py-3 min-[560px]:grid-cols-[92px_minmax(0,1fr)]"><div class="pt-[1px]">' + K.levelBadge(it.level) + '</div><p class="min-w-0 text-[14.5px] leading-[1.55] ' + (it.level === 'pass' ? 'text-zinc-300' : 'text-zinc-100') + ' [overflow-wrap:anywhere]">' + esc(it.text) + '</p></li>';
    }
    var act = pc.items.filter(function (it) { return it.level === 'block'; }).concat(pc.items.filter(function (it) { return it.level === 'warn'; }))
      .concat(pc.items.filter(function (it) { return it.level !== 'block' && it.level !== 'warn' && it.level !== 'pass'; }));
    var met = pc.items.filter(function (it) { return it.level === 'pass'; });
    var open = ui(s).open['met:' + c.id] === true;
    return '<div data-region="c-checks" class="scroll-mt-20"><h3 id="h-c-checks" tabindex="-1" class="mt-8 rounded ' + K.H3 + '">Checks before the commit</h3>' +
      (act.length ? '<ul class="mt-2.5 ' + K.LIST + '">' + act.map(row).join('') + '</ul>' : '<p class="mt-2.5 flex items-center gap-2 text-[14.5px] text-emerald-300">' + ic('check', 'h-4 w-4') + 'Nothing blocks this verdict and it carries no warning.</p>') +
      (met.length ? '<p class="mt-3">' + more('toggle', open, open ? 'Hide what is met' : met.length + (met.length === 1 ? ' check is met. Show it' : ' checks are met. Show them'), dataAttr('k', 'met') + dataAttr('id', c.id), 'met-' + c.id) + '</p>' +
        '<div id="met-' + esc(c.id) + '">' + (open ? '<ul class="mt-2.5 ' + K.LIST + '">' + met.map(row).join('') + '</ul>' : '') + '</div>' : '') + '</div>';
  }

  function recordRegion(s, c, v, w) {
    if (!v) return '<div data-region="c-record"></div>';
    var froz = frozen(w);
    var open = ui(s).open['rec:' + c.id] === true;
    return '<div data-region="c-record" class="mt-8 scroll-mt-20"><div class="rounded-xl bg-black/40 shadow-inner ring-1 ring-white/[0.1]">' +
      '<div class="flex flex-wrap items-center justify-between gap-3 px-4 py-2.5"><h3 id="h-c-record" tabindex="-1" class="rounded">' + more('toggle', open, froz ? 'Decision record, as filed' : 'Decision record, as it will be filed', dataAttr('k', 'rec') + dataAttr('id', c.id), 'rec-draft') + '</h3>' +
      btn('copy-record', 'Copy', { icon: 'copy' }) + '</div><div id="rec-draft">' +
      (open ? '<pre tabindex="0" aria-label="Decision record" class="overflow-x-auto whitespace-pre-wrap border-t border-white/[0.07] px-4 py-3 font-mono text-[12.5px] leading-[1.65] text-zinc-300 [overflow-wrap:anywhere]"><code>' + esc(M.draftRecord(s, c)) + '</code></pre>' : '') +
      '</div></div></div>';
  }

  function decidedNote(c, v, w) {
    var d = w.decision;
    var match = d.reference === true;
    return '<div class="mt-8 rounded-xl bg-white/[0.04] px-4 py-3.5 ring-1 ring-inset ring-white/[0.08]"><p class="text-[14.5px] leading-[1.6] text-zinc-200"><strong class="font-semibold text-white">Decision ' + esc(d.id) + ' committed</strong> ' +
      '<span class="text-zinc-400">' + esc(d.at) + ' by ' + esc(d.reviewer) + ', handle time ' + esc(GK.core.fmtDuration(d.handleMs)) + '</span></p>' +
      '<p class="mt-2 flex flex-wrap items-start gap-x-2.5 gap-y-1.5 text-[14.5px] leading-[1.6] text-zinc-300">' + badge(match ? 'ok' : 'warn', match ? 'Matches the reference path' : 'Differs from the reference path', match ? 'check' : 'triangle-alert') +
      '<span class="min-w-0 flex-1 basis-64">' + esc(v ? v.calibration : '') + '</span></p></div>';
  }

  function note(field, label, help, value, froz) {
    if (!froz) return K.field('text', field, label, value, 2, false, help, CAP.text);
    var text = String(value || '').trim();
    return '<div class="mt-5"><p class="text-[13px] font-medium text-zinc-200">' + esc(label) + '</p>' +
      '<p class="mt-1 whitespace-pre-wrap text-[14.5px] leading-[1.6] ' + (text ? 'text-zinc-200' : 'text-zinc-400') + ' [overflow-wrap:anywhere]">' + (text ? esc(value) : 'None written.') + '</p></div>';
  }

  function decide(s) {
    var c = caseOf(s);
    if (!c) return section('decide', '03', 'What do we do?', SUB.decide, '', K.empty('shield', 'No case selected'));
    var w = workOf(s, c.id);
    var v = verdictOf(c, w);
    var u = ui(s);
    var froz = frozen(w);
    if (!v) {
      var opts = c.verdicts.map(function (x) {
        return '<li class="grid grid-cols-[minmax(0,1fr)_auto] items-start gap-x-4 px-4 py-3.5"><div class="min-w-0"><p class="flex flex-wrap items-center gap-x-2.5 gap-y-1.5 text-[14.5px] font-semibold leading-snug text-white"><span>' + esc(x.label) + '</span>' + K.kindBadge(x.kind) +
          (s.hints && x.reference ? badge('info', 'Reference path', 'eye') : '') + '</p><p class="mt-1 text-[14.5px] leading-[1.6] text-zinc-300">' + esc(x.effect) + '</p></div>' +
          btn('pick', 'Choose', { attrs: dataAttr('id', x.id) + ' aria-label="Choose: ' + esc(x.label) + '"' }) + '</li>';
      }).join('');
      return section('decide', '03', 'What do we do?', SUB.decide, '',
        '<p class="mt-5 text-[15px] leading-[1.65] text-zinc-300">No verdict is chosen yet. These are the four options and what each one does.</p>' +
        '<ul class="mt-3 ' + K.LIST + '">' + opts + '</ul>' +
        '<p class="mt-3 text-[13.5px] leading-[1.55] text-zinc-400">The checks before the commit, the conditions and the decision record appear here once a verdict is chosen.</p>' +
        checksRegion(s, c, v, w) + recordRegion(s, c, v, w));
    }
    var pc = GK.core.policyChecks(c, v, w);
    var sel = {};
    GK.core.selectedConds(v, w).forEach(function (cd) { sel[cd.id] = true; });
    var all = v.conditions || [];
    var onN = all.filter(function (cd) { return sel[cd.id]; }).length;
    var headLine = '<p class="mt-5 flex flex-wrap items-center gap-x-2.5 gap-y-2 text-[17px] font-semibold leading-snug tracking-tight text-white"><span>' + esc(v.label) + '</span>' + K.kindBadge(v.kind) +
      (s.hints && v.reference ? badge('info', 'Reference path', 'eye') : '') + '</p>';

    if (froz && u.open['sec:decide:' + c.id] !== true) {
      return section('decide', '03', 'What do we do?', SUB.decide, '', headLine +
        '<p class="mt-2 text-[15px] leading-[1.65] text-zinc-300">' + esc((all.length ? onN + ' of ' + all.length + (all.length === 1 ? ' condition on. ' : ' conditions on. ') : 'No conditions. ') + 'Filed as ' + w.decision.id + '.') + '</p>' +
        '<p class="mt-2">' + more('toggle', false, 'Show the decision', dataAttr('k', 'sec:decide') + dataAttr('id', c.id), '') + '</p>');
    }

    var filedWords = u.open['audit:' + c.id] === true;
    var conds = all.length ? '<ul class="mt-2 space-y-0.5">' + all.map(function (cd) {
      return '<li><label class="flex cursor-pointer gap-3 rounded-lg px-3 py-2.5 transition-colors hover:bg-white/[0.04]"><input type="checkbox" data-act="cond"' + dataAttr('id', cd.id) + (sel[cd.id] ? ' checked' : '') + (froz ? ' disabled' : '') + ' class="mt-[3px] h-4 w-4 shrink-0 accent-zinc-400">' +
        '<span class="min-w-0"><span class="block text-[14.5px] leading-[1.55] text-zinc-100">' + esc(cd.label) + (cd.on === false ? ' <span class="whitespace-nowrap text-[12.5px] text-zinc-400">(optional, off unless you tick it)</span>' : '') + '</span>' +
        (filedWords ? '<span class="mt-0.5 block text-[14.5px] leading-[1.6] text-zinc-400">' + esc(cd.audit) + '</span>' : '') + '</span></label></li>';
    }).join('') + '</ul>' +
      '<p class="mt-1.5 px-3">' + more('toggle', filedWords, filedWords ? 'Hide the wording that is filed' : 'Show the wording that is filed for each', dataAttr('k', 'audit') + dataAttr('id', c.id), '') + '</p>'
      : '<p class="mt-2 text-[14.5px] text-zinc-400">This verdict carries no conditions.</p>';
    var why = u.open['why:' + c.id] === true;
    var body = headLine +
      '<fieldset class="mt-7"><legend class="' + K.H3 + '">Conditions that go into the record and the messages' + (all.length ? ' <span class="font-normal text-zinc-400">(' + onN + ' of ' + all.length + ' on)</span>' : '') + '</legend>' + conds + '</fieldset>' +
      checksRegion(s, c, v, w) +
      (pc.needsOverride ? note('override', 'Override justification', 'Required because this verdict carries warnings. At least 20 characters.', w.override, froz) : '') +
      (v.rationale ? '<h3 class="mt-8 ' + K.H3 + '">Why, for the audit record</h3><div class="mt-2.5 rounded-xl bg-white/[0.03] px-4 py-3.5 ring-1 ring-inset ring-white/[0.07]">' +
        '<p id="why-' + esc(c.id) + '" class="text-[14.5px] leading-[1.7] text-zinc-300' + (why ? '' : ' line-clamp-4') + '">' + esc(v.rationale) + '</p>' +
        '<p class="mt-2">' + more('toggle', why, why ? 'Show less' : 'Read the full rationale', dataAttr('k', 'why') + dataAttr('id', c.id), 'why-' + c.id) + '</p></div>' : '') +
      '<h3 class="mt-8 ' + K.H3 + '">Notes for the record</h3>' +
      note('note', 'Specialist note', 'Goes into the decision record.', w.note, froz) +
      note('gapNote', 'Runbook gap to flag', 'Goes into the report under the case.', w.gapNote, froz) +
      (froz ? decidedNote(c, v, w) : '') + recordRegion(s, c, v, w) +
      (froz ? '<p class="mt-5">' + more('toggle', true, 'Fold the decision', dataAttr('k', 'sec:decide') + dataAttr('id', c.id), '') + '</p>' : '');
    return section('decide', '03', 'What do we do?', SUB.decide, '', body);
  }

  // -- 04 What do we tell them?

  // Where the internal brief of a case with no account executive goes, in the case's own words: the first AE-brief sentence with "goes to".
  // ponytail: a sentence match on the case prose, not a data field; add a field if a case ever words this differently.
  function briefRoute(c) {
    var hit = '';
    (c.verdicts || []).forEach(function (v) {
      var ae = v.comms && v.comms.ae;
      ((ae && ae.open) || []).concat((ae && ae.close) || []).forEach(function (p) {
        var m = hit ? null : /[^.]*\bgoes to\b[^.]*\./.exec(String(p));
        if (m) hit = m[0].trim();
      });
    });
    return hit;
  }
  var AUD = [['customer', 'Customer notice', 'mail'], ['ae', 'Internal brief', 'users']];
  function recipient(c, aud) {
    function both(name, role) { return [name, role].map(function (x) { return String(x || '').trim().replace(/\s+/g, ' '); }).filter(Boolean).join(', '); }
    if (aud === 'customer') return both(c.contact.name, c.contact.role);
    return c.ae ? both(c.ae.name, c.ae.role) : 'the team (this case has no account executive)';
  }
  // The one lint definition (the engine's): the same call the pre-commit check makes.
  function lintOf(s, c, aud) {
    var m = M.commsFor(s, c, aud);
    if (!m) return null;
    var items = GK.core.lintMessage({ subject: m.subject, body: m.body }, c, aud);
    var bad = items.filter(function (it) { return !it.ok; });
    return { m: m, items: items, bad: bad, leak: bad.some(function (it) { return it.id === 'leak'; }) };
  }

  function badgeRegion(s, c, aud) {
    var l = lintOf(s, c, aud);
    if (!l) return '<span data-region="d-badge-' + aud + '"></span>';
    return '<span data-region="d-badge-' + aud + '" class="inline-flex flex-wrap items-center gap-x-2.5 gap-y-1">' +
      (l.leak ? badge('bad', 'Blocks the commit', 'octagon-x') : (l.bad.length ? badge('warn', l.bad.length + ' of ' + l.items.length + ' checks to fix', 'triangle-alert') : badge('ok', 'Passes ' + l.items.length + ' checks', 'check'))) +
      '<span class="font-mono text-[12px] tabular-nums text-zinc-400">' + esc(GK.core.wordCount(l.m.body) + (GK.core.wordCount(l.m.body) === 1 ? ' word' : ' words')) + '</span></span>';
  }

  function lintRegion(s, c, aud) {
    var l = lintOf(s, c, aud);
    if (!l) return '<div data-region="d-lint-' + aud + '"></div>';
    var line = l.bad.length
      ? '<div class="mb-2.5 flex gap-2 ' + (l.leak ? 'text-red-300' : 'text-amber-300') + '">' + ic(l.leak ? 'octagon-x' : 'triangle-alert', 'mt-[3px] h-4 w-4 shrink-0') +
        '<div class="min-w-0"><p class="font-medium">' + (l.leak ? 'This message names detection detail, which blocks the commit.' : l.bad.length + ' of ' + l.items.length + ' message checks need a look.') + '</p>' +
        '<ul class="mt-1 space-y-0.5 text-zinc-200">' + l.bad.map(function (it) { return '<li><span class="font-medium">' + esc(it.label) + ':</span> ' + esc(it.detail) + '</li>'; }).join('') + '</ul></div></div>'
      : '';
    var state = l.m.edited ? badge('info', 'Edited', 'pencil') + btn('resetedit', 'Reset to generated', { icon: 'rotate-ccw', attrs: dataAttr('aud', aud) })
      : (l.m.frozen ? badge('ok', 'Frozen at commit', 'lock') : '<span class="text-[13px] text-zinc-400">Generated from the verdict and the conditions. Edit the text to change it.</span>');
    return '<div data-region="d-lint-' + aud + '" class="border-t border-white/[0.07] px-5 py-3 text-[14.5px] leading-[1.55]">' + line +
      '<p class="flex flex-wrap items-center gap-x-3 gap-y-2">' + state + '</p></div>';
  }

  var LETTER = 'mt-1 block w-full resize-none rounded-lg bg-black/25 px-3 py-2 ring-1 ring-inset ring-white/[0.12] hover:ring-white/25 read-only:bg-transparent read-only:px-0 read-only:ring-0';

  function letter(s, c, w, a) {
    var aud = a[0];
    var m = M.commsFor(s, c, aud);
    var sent = w.sent[aud] === true;
    var froz = frozen(w);
    var folded = aud === 'ae' && ui(s).open['brief:' + c.id] !== true;
    var sentBtn = btn('sent', sent ? 'Marked as sent' : 'Mark as sent', { icon: 'send', attrs: dataAttr('aud', aud), disabled: !froz || sent, why: 'sent-reason-' + aud });
    var headBar = '<header class="flex flex-wrap items-center gap-x-2.5 gap-y-2 border-b border-white/[0.07] px-5 py-3 text-[13px]">' + ic(a[2], 'h-4 w-4 shrink-0 text-zinc-300') +
      '<h3 id="letter-' + aud + '" class="font-semibold text-white">' + a[1] + '</h3><span class="min-w-0 text-zinc-400">to ' + esc(recipient(c, aud)) + '</span>' +
      '<span class="ml-auto inline-flex flex-wrap items-center gap-x-2.5 gap-y-1.5">' + badgeRegion(s, c, aud) + (sent ? badge('ok', 'Marked as sent', 'send') : (froz ? sentBtn : '')) + '</span></header>';
    var reason = '<p id="sent-reason-' + aud + '" class="min-w-0 flex-1 basis-48 text-[12.5px] leading-[1.5] text-zinc-400">' + (froz ? (sent ? 'Simulation: nothing left this page.' : 'Simulated: this only records that the message was sent.') : 'Commit the decision to enable Mark as sent.') + '</p>';
    // Folded or open, a letter has its copy button; its name says which letter.
    var copyBtn = btn('copy-msg', 'Copy with 1 click', { icon: 'copy', attrs: dataAttr('aud', aud) + ' aria-label="Copy with 1 click: ' + esc(a[1].toLowerCase()) + '"' });
    if (folded) {
      return '<article aria-labelledby="letter-' + aud + '" class="' + K.CARD + '">' + headBar +
        '<div class="px-5 py-4"><p class="text-[15px] font-semibold leading-snug text-white">' + esc(m.subject) + '</p>' +
        '<p class="mt-1.5 line-clamp-3 whitespace-pre-line text-[14.5px] leading-[1.65] text-zinc-300">' + esc(m.body) + '</p>' +
        '<p class="mt-3 flex flex-wrap items-center gap-x-3 gap-y-2">' + copyBtn + more('toggle', false, froz ? 'Read the brief' : 'Read or edit the brief', dataAttr('k', 'brief') + dataAttr('id', c.id), '') + '</p>' + (froz ? '<div class="mt-2">' + reason + '</div>' : '') + '</div></article>';
    }
    var rows = Math.max(6, Math.min(60, Math.ceil(m.body.length / 72) + m.body.split('\n').length));
    return '<article aria-labelledby="letter-' + aud + '" class="' + K.CARD + '">' + headBar +

    },
    reopen: function () {
      if (!model.reopenCase(S, activeId())) return;
      T.focusSel = '[data-act="commit"]';
      refresh.apply(null, ['top', 'surge'].concat(CASE_REGIONS));
      toast('Case reopened. The decision is cleared and the sequence number is kept.', 'info');
    },
    sent: function (el) {
      var w = model.workOf(S, activeId());
      if (el.getAttribute('aria-disabled') === 'true') {
        toast(w.decision ? 'Already marked as sent.' : 'Commit the decision first.', 'warn');
        return;
      }
      if (model.markSent(S, activeId(), el.getAttribute('data-aud'))) {
        if (el.closest && el.closest('[data-region="rail"]')) T.focusSel = '[data-region="rail"] [data-act="sent"], [data-region="rail"] [data-act="open"], [data-region="rail"] [data-act="view"]';
        refresh('tell', 'rail');
        toast('Marked as sent. Simulation: nothing left this page.', 'ok');
      }
    },
    req: function (el) {
      var id = el.getAttribute('data-id');
      S.ui.reqOpen[id] = S.ui.reqOpen[id] !== true;
      refresh('head');
    },
    rec: function (el) {
      var id = el.getAttribute('data-id');
      S.ui.recOpen[id] = S.ui.recOpen[id] !== true;
      refresh('report');
    },
    hints: function () { S.hints = !S.hints; refresh('top', 'head', 'rail', 'decide'); },
    selftest: function (el) {
      var r = GK.core.selfTest();
      if (r.ok) {
        model.addLog(S, '', 'Self-test passed: ' + r.total + ' checks');
        toast('Self-test passed: ' + r.total + ' checks', 'ok');
      } else {
        r.failed.slice(0, 8).forEach(function (f) { model.addLog(S, '', 'Self-test failed: ' + f.name + (f.detail ? ' (' + f.detail + ')' : '')); });
        toast('Self-test failed: ' + r.failed.length + ' of ' + r.total + ' checks. Details are in the shift audit log.', 'bad');
      }
      if (S.drawer) drawerTab('log'); else openDrawer('log', '', el);
    },
    // The first press arms the button (it shows Confirm reset); the second resets. Esc or focus leaving it disarms (cancelReset).
    reset: function () {
      if (S.ui.confirmReset !== true) {
        S.ui.confirmReset = true;
        refresh('top');
        toast('Press Reset again to clear all work and restart the shift clock. Esc cancels.', 'warn');
        return;
      }
      // State first, so a reload after a render failure still starts clean.
      window.clearTimeout(T.tourTimer);
      announce('');
      T.gen += 1;
      T.opener = null;
      S = model.resetFrom(S, Date.now());
      tourDwell();
      save();
      try { window.localStorage.removeItem(KEPT); } catch (err) { /* storage is missing: nothing to clear */ }
      renderAll();
      var main = $('main');
      if (main) main.focus();
      toast('Reset. The shift clock restarted.', 'ok');
    },
    ref: function (el) {
      var want = el.getAttribute('data-tab');
      openDrawer(H.DRAWERS.indexOf(want) !== -1 ? want : (S.ui.drawerTab || 'criteria'), '', el);
    },
    dtab: function (el) { drawerTab(el.getAttribute('data-tab')); },
    dclose: function () { closeDrawer(); },
    detlang: function (el) { S.ui.detLang[el.getAttribute('data-id')] = el.getAttribute('data-lang') === 'spl' ? 'spl' : 'sql'; refresh('report'); },
    'copy-det': function (el) {
      var d = model.detectionOf(el.getAttribute('data-id'));
      if (d) copyText(String(model.detLangOf(S, d.id) === 'spl' ? d.spl : d.sql), 'Query copied');
    },
    download: function () { S.now = Date.now(); download(util.EXPORT_NAME, model.mdText(S), 'text/markdown;charset=utf-8'); },
    'copy-md': function () { S.now = Date.now(); copyText(model.mdText(S), 'Markdown copied'); },
    print: function () {
      if (S.view !== 'report') { S.view = 'report'; refresh('top', 'surge', 'main'); }
      window.setTimeout(function () { window.print(); }, 60);
    }
  };
  // These stay inert while aria-disabled; commit and sent explain themselves instead.
  var IGNORED_WHEN_DISABLED = { run: true, runall: true, citekey: true };

  function onClick(ev) {
    // detail is 0 for a click made with the keyboard.
    T.mouse = ev.detail > 0;
    var near = function (sel) { return ev.target && ev.target.closest ? ev.target.closest(sel) : null; };
    var shut = near('[data-toast-close]');
    if (shut) { var note = near('[data-toast]'); if (note) closeToast(note, !T.mouse); return; }
    var el = near('[data-act]');
    if (S.ui.tour && !near('[data-region="tour"]') && !(el && el.getAttribute('data-act') === 'tour')) tourStop('');
    if (!el || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
    var name = el.getAttribute('data-act');
    if (!Object.prototype.hasOwnProperty.call(ACTS, name)) return;
    if (el.getAttribute('aria-disabled') === 'true' && IGNORED_WHEN_DISABLED[name] === true) return;
    ACTS[name](el);
    if (name !== 'selftest') save();
  }

  function onChange(ev) {
    var el = ev.target;
    var name = el && el.getAttribute ? el.getAttribute('data-act') : '';
    if (name === 'verdict') {
      if (model.selectVerdict(S, activeId(), el.value)) { refresh('rail', 'decide', 'tell', 'bar'); save(); }
    } else if (name === 'cond') {
      if (model.toggleCond(S, activeId(), el.getAttribute('data-id'), el.checked)) { refresh('decide', 'tell', 'rail', 'bar'); save(); }
    } else if (name === 'fullq') {
      S.fullQueries = el.checked === true;
      save();
    }
  }

  function onInput(ev) {
    var el = ev.target;
    var name = el && el.getAttribute ? el.getAttribute('data-act') : '';
    if (name === 'reviewer') {
      model.setReviewer(S, el.value);
      if (el.value !== S.reviewer) el.value = S.reviewer;
      el.title = S.reviewer;
      var live = document.querySelectorAll('[data-live="reviewer"]');
      for (var i = 0; i < live.length; i++) live[i].textContent = S.reviewer;
      refresh('c-record');
      saveSoon();
    } else if (name === 'text') {
      var field = el.getAttribute('data-field');
      if (model.setText(S, activeId(), field, el.value)) {
        refresh.apply(null, field === 'override' ? ['c-checks', 'c-record', 'rail', 'bar'] : ['c-record']);
        saveSoon();
      }
    } else if (name === 'edit') {
      if (model.setEdit(S, activeId(), el.getAttribute('data-aud'), el.getAttribute('data-part'), el.value)) {
        // A pasted line break in the subject turns into a space in the model; the field shows that.
        var ed = S.work[activeId()].edits[el.getAttribute('data-aud')];
        if (el.getAttribute('data-part') === 'subject' && ed && el.value !== ed.subject) el.value = ed.subject;
        var who = el.getAttribute('data-aud') === 'ae' ? 'ae' : 'customer';
        refresh.apply(null, ['d-lint-' + who, 'd-badge-' + who].concat(DECISION_REGIONS));
        saveSoon();
      }
    }
  }

  var FOCUSABLE = 'button:not([disabled]), [href], input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';

  function onKeydown(ev) {
    T.mouse = false;
    var t = ev.target;
    if (ev.key === 'Enter' && !ev.isComposing && t && t.getAttribute && t.getAttribute('data-part') === 'subject') { ev.preventDefault(); return; }
    if (ev.key === 'Escape' && S.drawer) { ev.preventDefault(); closeDrawer(); return; }
    if (ev.key === 'Escape' && S.ui.tour) { ev.preventDefault(); tourStop('', true); return; }
    if (ev.key === 'Escape' && S.ui.confirmTour) { ev.preventDefault(); cancelTour(); return; }
    if (S.drawer && ev.key === 'Tab') {
      var panel = drawerNodes().panel;
      var list = panel ? Array.prototype.filter.call(panel.querySelectorAll(FOCUSABLE), function (n) { return n.offsetParent !== null; }) : [];
      if (list.length) {
        var first = list[0], last = list[list.length - 1];
        if (!panel.contains(t)) { ev.preventDefault(); first.focus(); }
        else if (ev.shiftKey && (t === first || t === panel)) { ev.preventDefault(); last.focus(); }
        else if (!ev.shiftKey && t === last) { ev.preventDefault(); first.focus(); }
      }
      return;
    }
    if (t && t.getAttribute && t.getAttribute('role') === 'tab' && /^(ArrowLeft|ArrowRight|Home|End)$/.test(ev.key)) {
      var tabs = Array.prototype.slice.call(t.closest('[role="tablist"]').querySelectorAll('[role="tab"]'));
      var i = tabs.indexOf(t);
      var next = ev.key === 'Home' ? 0 : (ev.key === 'End' ? tabs.length - 1 : (i + (ev.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length);
      ev.preventDefault();
      tabs[next].focus();
      tabs[next].click();
      return;
    }
    if (ev.key === 'Escape' && S.ui.confirmReset) { ev.preventDefault(); cancelReset(); return; }
    if (ev.key === 'Escape') {
      var stuck = stickyToasts($('gk-toasts'));
      if (stuck.length) { ev.preventDefault(); closeToast(stuck[stuck.length - 1], true); return; }
    }
    // Single-key shortcuts (WCAG 2.1.4) run only while the switch in the Shortcuts tab is on.
    if (ev.ctrlKey || ev.metaKey || ev.altKey || S.drawer || S.keys === false) return;
    var tag = t && t.tagName ? t.tagName : '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    var key = String(ev.key).toLowerCase();
    var all = util.queueOrder(S);
    var done = false;
    if (S.ui.tour && /^[jkqr1-9]$/.test(key)) tourStop('');
    var was = S.active + '|' + S.view;
    if (key === 'j') done = model.stepCase(S, 1);
    else if (key === 'k') done = model.stepCase(S, -1);
    else if (/^[1-9]$/.test(key) && all[Number(key) - 1]) done = model.openCase(S, all[Number(key) - 1].id);
    else if (key === 'q') { model.setView(S, 'queue'); done = true; }
    else if (key === 'r') { model.setView(S, 'report'); done = true; }
    if (done) { ev.preventDefault(); if (S.active + '|' + S.view !== was) refresh('top', 'surge', 'main'); if (key === 'q' || key === 'r') window.scrollTo(0, 0); save(); }
  }

  function cancelReset() {
    if (S.ui.confirmReset !== true) return;
    S.ui.confirmReset = false;
    refresh('top');
  }
  // Arming re-renders the top bar, which replaces the focused button, so a blur from our own render is ignored until focus has landed.
  function onFocusOut(ev) {
    var t = ev.target;
    var act = t && t.getAttribute ? t.getAttribute('data-act') : '';
    var armed = (act === 'reset' && S.ui.confirmReset === true) || (act === 'tour' && S.ui.confirmTour === true);
    if (!armed || T.rendering) return;
    window.setTimeout(guard(function () {
      var a = document.activeElement;
      if (a && a.getAttribute && a.getAttribute('data-act') === act) return;
      if (act === 'reset') cancelReset(); else cancelTour();
    }), 0);
  }

  // Printing from the queue prints the report: a print-only copy is mounted and removed after, so the workspace, its focus and its scroll stay.
  function beforePrint() {
    if (S.view === 'report') return;
    mountHtml('gk-print', views.report(S));
  }
  function afterPrint() { mountHtml('gk-print', ''); }

  // -- the 1 Hz tick: text nodes only, so nothing a person is typing is ever re-rendered

  function tick() {
    S.now = Date.now();
    var nodes = document.querySelectorAll('[data-sla]');
    for (var i = 0; i < nodes.length; i++) {
      var c = GK.core.caseById(nodes[i].getAttribute('data-sla'));
      if (!c) continue;
      var info = util.slaInfo(S, c);
      if (nodes[i].textContent !== info.text) nodes[i].textContent = info.text;
      if (nodes[i].getAttribute('data-tone') !== info.tone) nodes[i].setAttribute('data-tone', info.tone);
    }
    var depth = document.querySelectorAll('[data-surge="queue"]');
    if (depth.length) {
      var q = String(util.queueDepth(S));
      for (var d = 0; d < depth.length; d++) if (depth[d].textContent !== q) depth[d].textContent = q;
    }
    var clocks = document.querySelectorAll('[data-clock]');
    if (clocks.length) {
      var set = util.clocksOf(S);
      for (var k = 0; k < clocks.length; k++) {
        var id = clocks[k].getAttribute('data-clock');
        var it = set ? set.items.filter(function (x) { return x.id === id; })[0] : null;
        if (!it) continue;
        var txt = util.clockText(S, it);
        var left = it.due === null ? 1 : it.due - S.now;
        var tn = left <= 0 ? 'crit' : (it.due !== null && left < 3600000 ? 'warn' : 'ok');
        if (clocks[k].textContent !== txt) clocks[k].textContent = txt;
        if (clocks[k].getAttribute('data-tone') !== tn) clocks[k].setAttribute('data-tone', tn);
      }
    }
  }

  function init() {
    if (typeof document === 'undefined') return;
    var now = Date.now();
    var raw = readStorage();
    var revived = false;
    try { revived = raw ? model.revive(raw, now) : false; } catch (err) { revived = false; }
    var hadWork = !!revived && model.hasWork(revived);
    S = revived || model.fresh(now);
    S.now = now;
    document.addEventListener('click', guard(onClick));
    document.addEventListener('change', guard(onChange));
    document.addEventListener('input', guard(onInput));
    document.addEventListener('keydown', guard(onKeydown));
    document.addEventListener('focusout', guard(onFocusOut));
    // Leaving or hiding the page flushes a pending save; a running walkthrough pauses when the page is hidden, so it files nothing unwatched.
    document.addEventListener('visibilitychange', guard(function () {
      if (document.hidden) { tourPause('The walkthrough paused in demo mode. The page was not in view.'); save(); } else tick();
    }));
    window.addEventListener('pagehide', guard(function () { save(); }));
    window.addEventListener('resize', guard(function () { measureTop(); measureTour(!!S.ui.tour); growAll(); }));
    window.addEventListener('scroll', guard(function () {
      if (T.spyQueued) return;
      T.spyQueued = true;
      window.requestAnimationFrame(guard(function () { T.spyQueued = false; spy(); }));
    }), { passive: true });
    window.addEventListener('beforeprint', guard(beforePrint));
    window.addEventListener('afterprint', guard(afterPrint));
    T.tickTimer = window.setInterval(guard(tick), 1000);
    // Start fresh over stored work when the text fails the validator or a view throws on it. Text that could not be read, or that holds work, is kept aside first,
    // so nothing typed is lost to a fault; a state with no work is not kept, so a page that still faults on reload does not replace the kept copy with the empty state.
    var unread = !!raw && !revived;
    var failed = false;
    try { renderAll(); } catch (err) {
      if (window.console) window.console.error(err);
      failed = true;
      S = model.resetFrom(S, now);
      guard(renderAll)();
    }
    var aside = false;
    try {
      if (raw && (unread || (failed && hadWork))) window.localStorage.setItem(KEPT, raw);
      aside = (unread || failed) && window.localStorage.getItem(KEPT) !== null;
    } catch (err2) { aside = false; }
    save();
    var tail = aside ? ' The earlier state is kept in this browser under ' + KEPT + '.' : '';
    if (unread) toast('Saved state could not be read. The workbench started fresh.' + tail, 'warn', true);
    else if (failed) toast('The workbench hit an error on load and started fresh.' + tail, 'warn', true);
  }

  GK.ui.init = init;
  GK.ui.state = function () { return S; };
})();

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { GK.ui.init(); });
  else GK.ui.init();
}
</script>
</body>
</html>
