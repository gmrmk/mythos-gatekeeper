  clauses: [
    { id: 'MOD-01', group: 'Models and retention', title: 'One model, two safeguard tiers', page: 'mythos', simulated: false,
      text: 'Fable 5.2 and Mythos 5.2 are the same underlying model. Fable is generally available with safeguards that block or limit risky cybersecurity and biology work. Mythos 5.2 is for vetted cyberdefenders and life scientists, through the trusted access programs.' },
    { id: 'MOD-02', group: 'Models and retention', title: 'Mythos fast mode rides on trusted access', page: 'launch', simulated: false,
      text: 'Standard pricing is 8 USD in and 40 USD out per million tokens. Fast mode is 16 USD in and 80 USD out, on Claude Code, the Claude Platform, Google Cloud and Microsoft Foundry. Mythos fast mode is only for organizations in the verification programs; fast mode on Fable has no such limit.' },
    { id: 'MOD-03', group: 'Models and retention', title: 'Fewer blocks than Fable 5.1', page: 'launch', simulated: false,
      text: 'In early testing across claude.ai, Claude Code and Cowork, Fable 5.2 produced about 55% fewer blocks than Fable 5.1: about 60% fewer in cybersecurity and about 40% fewer in biology.' },
    { id: 'RET-01', group: 'Models and retention', title: 'Thirty-day retention on covered models', page: 'retention', simulated: false,
      text: 'Covered models (Mythos-class models and later models Anthropic designates) retain prompts and outputs for 30 days for safety monitoring. A zero-retention organization turns retention on to use them, per workspace in Console.' },
    { id: 'RET-02', group: 'Models and retention', title: 'Zero retention kept for eligible CVP customers', page: 'mythos', simulated: false,
      text: 'Until Enterprise Frontier Safeguards is available, eligible Cyber Verification Program customers who already have zero data retention can keep it for Mythos 5.2.' },
    { id: 'RET-03', group: 'Models and retention', title: 'Enterprise Frontier Safeguards', page: 'launch', simulated: false,
      text: 'Enterprise Frontier Safeguards runs automated safety monitoring on prompts and responses stored in the customer\'s own infrastructure, which makes it compatible with zero data retention. It is in private beta. Eligible customers can keep using Fable 5.2 and Mythos 5.2 with zero data retention before they implement it.' },
    { id: 'RET-04', group: 'Models and retention', title: 'Eligibility notice', page: 'retention', simulated: false,
      text: 'Some zero-retention organizations receive a notice that they are eligible to use Fable with zero retention. Organizations without that notice turn retention on before using covered models. The article gives no delivery method for the notice.' },
    { id: 'CVP-ZDR', group: 'Models and retention', title: 'Retention inside the cyber program', page: 'cvp-help', simulated: false,
      text: 'Data retention is required for everyone enrolled. An organization with a data retention exemption for Fable or Mythos models can use the program with zero data retention on all program models, for internal use.' },
    { id: 'CVP-EVAL', group: 'Models and retention', title: 'Existing members and new models', page: 'cvp-news', simulated: false,
      text: 'Existing members keep their settings for earlier models and will be evaluated automatically for the newer models of the updated program. Admins still assign access to specific workspaces. Each tier includes the most capable models, and new models are added over time.' },
    { id: 'RET-COVERED', group: 'Models and retention', title: 'Zero retention as a transition', page: 'covered', simulated: false,
      text: 'Eligible customers get the option to use zero data retention with Fable 5.2, 5.1 and 5 for their own internal business applications. The article calls it limited-time and a transition to Enterprise Frontier Safeguards; Anthropic or the cloud provider contacts eligible organizations. Real-time classifiers, the Usage Policy and enforcement still apply.' },
    { id: 'RET-BEDROCK', group: 'Models and retention', title: 'Amazon Bedrock: the retention mode is set in the customer\'s AWS account', page: 'aws-retention', simulated: false,
      text: 'On Amazon Bedrock, Fable 5, 5.1 and 5.2 need the data retention mode aws_review (the legacy provider_data_share also satisfies it), set per Region on the account, or on a project of the bedrock-mantle endpoint (a request on bedrock-runtime cannot be scoped to a project). Prompts and outputs are kept for up to 30 days inside the AWS boundary and may be reviewed by AWS; they are not shared with the model provider. With the mode none or default, the model list of bedrock-mantle shows the model as unavailable and a request on bedrock-runtime fails with a ValidationException. Zero retention for a model that requires retention is evaluated by AWS per account and per model, in coordination with the model provider.' },
    { id: 'RET-BEDROCK-ID', group: 'Models and retention', title: 'Amazon Bedrock: cross-Region inference profiles', page: 'aws-launch', simulated: false,
      text: 'Fable 5.2 and Mythos 5.2 are offered on Amazon Bedrock through US Geo and Global cross-Region inference profiles. The Global profile of Fable 5.2 is global.anthropic.claude-fable-5-2. The retention mode aws_review is set before the model is invoked.' },
    { id: 'RET-ZDR-EFS', group: 'Models and retention', title: 'Zero retention for internal use, through at least 30 June 2027', page: 'aws-abuse', simulated: false,
      text: 'A customer eligible for Enterprise Frontier Safeguards can use Fable 5, 5.1 and 5.2 on Amazon Bedrock with zero data retention for internal use through at least 30 June 2027. After zero retention ends, traffic is retained for up to 30 days. Eligibility is asked of the AWS account team.' },
    { id: 'BAA-SPLIT', group: 'Models and retention', title: 'BAA and zero retention do not share an organization', page: 'baa', simulated: false,
      text: 'HIPAA readiness and zero data retention cannot sit on one first-party API organization: a customer that needs both uses separate organization ids. A request to a covered model from an organization or workspace with zero data retention returns an error, and Claude Code with zero data retention cannot use covered models unless Anthropic has expressly authorized it for the organization. Eligible customers have their own route (RET-03, RET-COVERED).' },

    { id: 'CVP-DEF-ELIG', group: 'Cyber Verification Program', title: 'Defense Access: who and what', page: 'cvp-help', simulated: false,
      text: 'Organizations and individuals on Pro, Max, Ultra, Team, Enterprise or API plans. Covers security operations, incident response, malware analysis, detection engineering, and vulnerability triage and validation. No default user cap; an individual\'s access covers only that person. Critical infrastructure operators usually fit this tier.' },
    { id: 'CVP-DEF-WHO', group: 'Cyber Verification Program', title: 'Defense Access: who the announcement names', page: 'cvp-news', simulated: false,
      text: 'The announcement names security teams at companies, nonprofits, universities and government bodies, smaller security firms, open-source maintainers, individual researchers with a record of reported vulnerabilities, and operators of critical infrastructure of any size, such as regional hospitals and municipal utilities.' },
    { id: 'CVP-DEF-TIME', group: 'Cyber Verification Program', title: 'Defense Access: review target', page: 'cvp-help', simulated: false,
      text: 'The review target is two days.' },
    { id: 'CVP-RT-ELIG', group: 'Cyber Verification Program', title: 'Red Team Access: who and what', page: 'cvp-help', simulated: false,
      text: 'Organizations only, on Team, Enterprise or API plans. Covers authorized penetration testing, red teaming, adversary emulation, offensive tool development and exploit development. Up to 75 approved users.' },
    { id: 'CVP-RT-EVID', group: 'Cyber Verification Program', title: 'Red Team Access: evidence', page: 'cvp-help', simulated: false,
      text: 'A penetration-testing or cybersecurity firm shows one of these in its own name: a CVE Numbering Authority listing, full FIRST membership, a recent CVE credit, or a testing accreditation such as CREST, CHECK or FedRAMP 3PAO. A smaller firm without one shows all of these: a business registration at least one year old, public information about its testing services, at least two testers with offensive security certifications, and a redacted statement of work, test report or client reference from the last 12 months. An in-house red team shows proof of a security program, its team, advance authorization of each test, and one of certifications, public work or a redacted report. Meeting a row does not guarantee approval.' },
    { id: 'CVP-RT-ATTEST', group: 'Cyber Verification Program', title: 'Red Team Access: attestations', page: 'cvp-help', simulated: false,
      text: 'Every Red Team applicant attests to phishing-resistant MFA, API keys replaced at least every seven days, company-domain accounts, organization-controlled devices, outbound network controls and background checks.' },
    { id: 'CVP-RT-TIME', group: 'Cyber Verification Program', title: 'Red Team Access: review target', page: 'cvp-help', simulated: false,
      text: 'The review target is two weeks. Reviews are currently taking longer because of high demand.' },
    { id: 'CVP-SPEC', group: 'Cyber Verification Program', title: 'Specialized Access', page: 'cvp-help', simulated: false,
      text: 'Organizations only, up to 25 approved users. Covers authorized testing of critical infrastructure and research into the highest-severity techniques. Reviews involve the US government and have no set target. Operating critical infrastructure alone does not qualify.' },
    { id: 'CVP-INTERIM', group: 'Cyber Verification Program', title: 'Lower tier during review', page: 'cvp-help', simulated: false,
      text: 'An applicant for Red Team or Specialized Access that qualifies for a lower tier receives that tier while the rest of the application is reviewed.' },
    { id: 'CVP-PENDING', group: 'Cyber Verification Program', title: 'Pending Red Team applications', page: 'cvp-news', simulated: false,
      text: 'The announcement says qualifying organizations are enrolled in Defense Access while their Red Team application is reviewed. It does not define qualifying. Red Team Access is for organizations only; individual researchers are not eligible.' },
    { id: 'CVP-USE', group: 'Cyber Verification Program', title: 'Internal use by default', page: 'cvp-help', simulated: false,
      text: 'Program use is internal by default: security work on the organization\'s own code, products and infrastructure, including coordinated disclosure that is not done for a client. Work for customers needs a separate external-use approval after program approval. Serving customers without it violates the program terms and can lead to removal from the program.' },
    { id: 'CVP-SCOPE', group: 'Cyber Verification Program', title: 'What access attaches to', page: 'cvp-help', simulated: false,
      text: 'On a Team plan, access covers the whole organization. In Console it applies to workspaces. Red Team and Specialized Access switch off when the organization exceeds the tier\'s seat limit.' },
    { id: 'CVP-BLOCK', group: 'Cyber Verification Program', title: 'Blocked at every tier', page: 'cvp-help', simulated: false,
      text: 'Mass destruction of data or devices, denial of service, physical-world damage, extortion, election interference and any request with stated malicious intent stay blocked at every tier. The program adjusts cyber safeguards only; other safeguards and the Usage Policy still apply.' },
    { id: 'CVP-REAPPLY', group: 'Cyber Verification Program', title: 'When an application is not approved', page: 'cvp-help', simulated: false,
      text: 'An applicant who is not approved keeps generally available models and any tier already approved, and can reapply after seven days, ideally with changed circumstances or new evidence. The article describes no appeal.' },
    { id: 'CVP-SEC-INCIDENT', group: 'Cyber Verification Program', title: 'Security contact and incident duties', page: 'cvp-sec', simulated: false,
      text: 'Participants name a security contact, report suspected breaches or misuse within 72 hours and security incidents within 24 hours, investigate abuse Anthropic identifies within 48 hours, and answer misuse inquiries within seven days.' },
    { id: 'CVP-SEC-CREDS', group: 'Cyber Verification Program', title: 'Sign-in and credentials', page: 'cvp-sec', simulated: false,
      text: 'Each approved user signs in as themselves; shared sign-ins, seats, sessions and workload identities are not permitted, and neither are browser extensions or proxy tools that expose a session to others. For Defense Access, MFA is required now. From 15 December 2026 it must be phishing-resistant and static or long-lived credentials are not allowed; until then an API key is kept in a secrets manager, assigned to one person or workload and replaced at least every seven days. On Amazon Bedrock, IAM user access keys are not permitted from the same date; a short-term Bedrock API key that expires within 12 hours or with the Bedrock session, whichever is shorter, is the exception. For Red Team and Specialized Access the Bedrock rule has no later date.' },
    { id: 'CVP-SEC-RT', group: 'Cyber Verification Program', title: 'Red Team and Specialized Access: credentials and accounts', page: 'cvp-sec', simulated: false,

      label: 'Payment and enforcement linkage',
      window: 'All time; every organization on the applicant\'s payment cluster',
      required: true,
      sql: [
        "-- Every organization that shares a payment cluster with the applicant, grouped by the",
        "-- enforcement cluster its suspension or termination belongs to ('none' = never actioned).",
        "-- apps: the open Red Team applications, latest row per grant. approved_user_count is what was",
        "-- asked for: Red Team Access allows 75 and Specialized Access 25 (seat_count_over_25).",
        "-- The reads of payment_instruments, actions and program_enrollments are all-time on purpose: a suspension of a cluster member can",
        "-- predate the applicant by any length of time, and the finding counts every one of them. The latest",
        "-- application row per grant needs the full history of the grant.",
        "WITH applicant AS (",
        "  SELECT DISTINCT payment_cluster_id",
        "  FROM `billing_prod.payment_instruments`",
        "  WHERE org_id IN ('org_7c41e0d2', 'org_7c41e0d3')",
        "),",
        "linked AS (",
        "  SELECT",
        "    p.payment_cluster_id,",
        "    p.org_id,",
        "    MIN(p.first_seen_ts) AS first_seen_ts",
        "  FROM `billing_prod.payment_instruments` AS p",
        "  JOIN applicant AS a",
        "    ON a.payment_cluster_id = p.payment_cluster_id",
        "  GROUP BY p.payment_cluster_id, p.org_id",
        "),",
        "actioned AS (",
        "  SELECT",
        "    org_id,",
        "    ANY_VALUE(cluster_id) AS enforcement_cluster,",
        "    STRING_AGG(DISTINCT reason_code, ', ') AS reason_codes,",
        "    MAX(action_ts) AS last_action_ts",
        "  FROM `enforcement_prod.actions`",
        "  WHERE action_type IN ('suspend', 'terminate')",
        "  GROUP BY org_id",
        "),",
        "apps AS (",
        "  SELECT org_id, cvp_tier, approved_user_count, seat_count_over_25",
        "  FROM (",
        "    SELECT",
        "      org_id,",
        "      cvp_tier,",
        "      approved_user_count,",
        "      seat_count_over_25,",
        "      status,",
        "      ROW_NUMBER() OVER (",
        "        PARTITION BY org_id, workspace_id, tier, model_scope",
        "        ORDER BY enrolled_ts DESC",
        "      ) AS rn",
        "    FROM `access_prod.program_enrollments`",
        "    WHERE program = 'CVP'",
        "  )",
        "  WHERE rn = 1",
        "    AND status IN ('queued', 'in_review')",
        "    AND cvp_tier = 'red_team_access'",
        ")",
        "SELECT",
        "  l.payment_cluster_id,",
        "  IFNULL(x.enforcement_cluster, 'none') AS enforcement_cluster,",
        "  COUNT(DISTINCT l.org_id) AS organizations,",
        "  IFNULL(STRING_AGG(DISTINCT x.reason_codes, ', '), 'none') AS reason_codes,",
        "  DATE(MIN(l.first_seen_ts), 'America/Los_Angeles') AS first_org_seen,",
        "  IFNULL(CAST(DATE(MAX(x.last_action_ts), 'America/Los_Angeles') AS STRING), 'none') AS last_action,",
        "  IF(LOGICAL_OR(l.org_id IN ('org_7c41e0d2', 'org_7c41e0d3')), 'yes', 'no') AS includes_applicant,",
        "  COUNT(DISTINCT ap.org_id) AS red_team_applications,",
        "  IFNULL(MAX(ap.approved_user_count), 0) AS max_approved_users,",
        "  IFNULL(LOGICAL_OR(ap.seat_count_over_25), FALSE) AS seat_count_over_25",
        "FROM linked AS l",
        "LEFT JOIN actioned AS x",
        "  ON x.org_id = l.org_id",
        "LEFT JOIN apps AS ap",
        "  ON ap.org_id = l.org_id",
        "GROUP BY l.payment_cluster_id, IFNULL(x.enforcement_cluster, 'none')",
        "ORDER BY organizations DESC;"
      ].join('\n'),
      spl: [
        '``` One pass over billing, enforcement and access, merged by organization, so no join and no subsearch row limit sits on the enforcement side. ```',
        '``` The reads of the billing, enforcement and access indexes are all-time on purpose (earliest=0): a suspension of a cluster member can predate the applicant by any length of time, and the latest application row per grant needs the full history of the grant. ```',
        '(index=billing sourcetype=payment:instrument [ search index=billing sourcetype=payment:instrument org_id IN ("org_7c41e0d2", "org_7c41e0d3") earliest=0 | dedup payment_cluster_id | fields payment_cluster_id ]) OR (index=enforcement sourcetype=enforcement:action action_type IN ("suspend", "terminate")) OR (index=access sourcetype=program:enrollment program="CVP" cvp_tier="red_team_access") earliest=0',
        '| eval seen=if(sourcetype="payment:instrument", strptime(first_seen_ts, "%Y-%m-%dT%H:%M:%S%z"), null())',
        '| eval acted=if(sourcetype="enforcement:action", _time, null())',
        '| fillnull value="none" workspace_id, tier, model_scope',
        '| stats values(payment_cluster_id) AS payment_cluster_id, min(seen) AS first_seen, latest(cluster_id) AS enforcement_cluster, values(reason_code) AS reason_codes, max(acted) AS last_action, latest(status) AS app_status, latest(approved_user_count) AS approved_user_count, latest(seat_count_over_25) AS over_25_flag BY org_id, workspace_id, tier, model_scope',
        '| eval is_app=if(app_status="queued" OR app_status="in_review", 1, 0)',
        '| eval over_25=if(is_app=1 AND over_25_flag="true", 1, 0), asked=if(is_app=1, approved_user_count, null())',
        '| stats values(payment_cluster_id) AS payment_cluster_id, min(first_seen) AS first_seen, max(enforcement_cluster) AS enforcement_cluster, values(reason_codes) AS reason_codes, max(last_action) AS last_action, max(is_app) AS has_app, max(asked) AS asked, max(over_25) AS over_25 BY org_id',
        '| where isnotnull(payment_cluster_id)',
        '| fillnull value="none" enforcement_cluster',
        '| eval is_applicant=if(org_id="org_7c41e0d2" OR org_id="org_7c41e0d3", 1, 0)',
        '| stats dc(org_id) AS organizations, values(reason_codes) AS reason_codes, min(first_seen) AS first_org_seen, max(last_action) AS last_action, max(is_applicant) AS includes_applicant, sum(has_app) AS red_team_applications, max(asked) AS max_approved_users, max(over_25) AS over_25 BY payment_cluster_id, enforcement_cluster',
        '| eval first_org_seen=strftime(first_org_seen, "%Y-%m-%d"), last_action=if(isnull(last_action), "none", strftime(last_action, "%Y-%m-%d")), includes_applicant=if(includes_applicant=1, "yes", "no")',
        '| fillnull value="none" reason_codes',
        '| fillnull value=0 max_approved_users',
        '| eval seat_count_over_25=if(over_25=1, "true", "false")',
        '| table payment_cluster_id, enforcement_cluster, organizations, reason_codes, first_org_seen, last_action, includes_applicant, red_team_applications, max_approved_users, seat_count_over_25',
        '| sort - organizations'

        "-- svc-pipeline since 12 Sep. A takeover shows as failures, then a success on a new network, then",
        "-- a new credential. Sharing shows as many addresses on one network and one old credential.",
        "-- credential_ttl_hours is set on oauth_grant_created only: the lifetime of the token that was issued (12 hours is the written limit of Red Team and",
        "-- Specialized Access, shown for reference: the lab's grant writes no limit). It is n/a on every other event.",
        "WITH events AS (",
        "  SELECT",
        "    seat_id,",
        "    event_ts,",
        "    event_type,",
        "    client_ip,",
        "    asn,",
        "    ip_type,",
        "    mfa_used,",
        "    credential_ttl_hours,",
        "    COALESCE(credential_id, session_id) AS cred_or_session",
        "  FROM `identity_prod.auth_events`",
        "  WHERE org_id = 'org_c90a3d64'",
        "    AND seat_id IN ('gsr-14', 'svc-pipeline')",
        "    AND event_ts >= TIMESTAMP('2026-09-12 00:00:00', 'America/Los_Angeles')",
        "    AND event_ts <  TIMESTAMP('2026-11-11 05:30:00', 'America/Los_Angeles')",
        "    AND (seat_id = 'svc-pipeline'",
        "         OR event_ts >= TIMESTAMP('2026-11-10 00:00:00', 'America/Los_Angeles'))",
        ")",
        "SELECT",
        "  seat_id,",
        "  IF(MIN(event_ts) = MAX(event_ts),",
        "     FORMAT_TIMESTAMP('%d %b %H:%M', MIN(event_ts), 'America/Los_Angeles'),",
        "     CONCAT(FORMAT_TIMESTAMP('%d %b %H:%M', MIN(event_ts), 'America/Los_Angeles'), ' to ',",
        "            FORMAT_TIMESTAMP('%d %b %H:%M', MAX(event_ts), 'America/Los_Angeles'))) AS window_pt,",
        "  event_type,",
        "  COUNT(*) AS events,",
        "  COUNT(DISTINCT client_ip) AS addresses,",
        "  CONCAT('AS', CAST(asn AS STRING), ' ', ip_type) AS asn_network,",
        "  IF(LOGICAL_OR(mfa_used), 'yes', 'no') AS mfa_used,",
        "  IFNULL(STRING_AGG(DISTINCT cred_or_session, ', '), 'none') AS credential_or_session,",
        "  IFNULL(CAST(MAX(credential_ttl_hours) AS STRING), 'n/a') AS credential_ttl_hours",
        "FROM events",
        "GROUP BY seat_id, event_type, asn, ip_type",
        "ORDER BY seat_id, MIN(event_ts);"
      ].join('\n'),
      spl: [
        '``` Search time zone is US Pacific. gsr-14 is read from 10 Nov 00:00; svc-pipeline from 12 Sep; both end at 05:30. ```',
        'index=identity sourcetype=auth:event org_id="org_c90a3d64" seat_id IN ("gsr-14", "svc-pipeline") earliest="09/12/2026:00:00:00" latest="11/11/2026:05:30:00"',
        '| where seat_id="svc-pipeline" OR _time >= strptime("2026-11-10 00:00:00", "%Y-%m-%d %H:%M:%S")',
        '| eval cred_or_session=coalesce(credential_id, session_id)',
        '| eval mfa=if(mfa_used="true" OR mfa_used=1, 1, 0)',
        '| stats min(_time) AS first_ts, max(_time) AS last_ts, count AS events, dc(client_ip) AS addresses, max(mfa) AS mfa, values(cred_or_session) AS credential_or_session, max(credential_ttl_hours) AS credential_ttl_hours BY seat_id, event_type, asn, ip_type',
        '| eval window_pt=if(first_ts=last_ts, strftime(first_ts, "%d %b %H:%M"), strftime(first_ts, "%d %b %H:%M") . " to " . strftime(last_ts, "%d %b %H:%M"))',
        '| eval asn_network="AS" . asn . " " . ip_type',
        '| eval mfa_used=if(mfa=1, "yes", "no")',
        '| fillnull value="none" credential_or_session',
        '| fillnull value="n/a" credential_ttl_hours',
        '| sort 0 seat_id, first_ts',
        '| table seat_id, window_pt, event_type, events, addresses, asn_network, mfa_used, credential_or_session, credential_ttl_hours'
      ].join('\n'),

  gaps: [
    {
      id: 'GAP-1',
      title: 'Defense Access as the interim tier has no linkage precondition, no owner and no clock',
      priority: 'P1',
      owner: 'Safeguards Policy, with CVP intake',
      cases: ['GK-4471', 'GK-4502'],

      written: 'The Cyber Verification Program help article gives Red Team Access to organizations that show a firm credential or, for a smaller firm, a registration at least one year old with public services, certified testers and recent client evidence. An applicant for a higher tier that qualifies for a lower one receives the lower tier during review, and the announcement says qualifying organizations are enrolled in Defense Access while their Red Team application is reviewed, without defining qualifying. Defense Access is open to organizations and individuals on paid plans for defensive work, with a two-day review target and no evidence rows. An applicant who is not approved can reapply after seven days.',
      observed: [
        { caseId: 'GK-4471', text: 'A 19-day-old LLC applied for Red Team Access with six attestations ticked and no evidence. The written evidence rows stopped it: no firm credential, and a registration far short of one year. The applicant then asked for "whatever tier turns the blocks off". Nothing written asks about its payment instrument, which sits in a cluster where 37 organizations were suspended by 17 September, or about the three sibling organizations that filed near-identical applications on 9 and 10 November. Defense Access, the tier it asked for by description, has no evidence rows to fail.' },
        { caseId: 'GK-4502', text: 'A municipal water utility and two open-source maintainers needed to confirm a controller firmware flaw on a test bench before a patch window on 14 and 15 November. They filed for Red Team Access because the form\'s wording matched the task. The pages write a route for that situation: Defense Access while the Red Team application is reviewed. Nearly two days later the application was queued with no reviewer and no Defense Access enrollment. Nothing triggers that enrollment or owns it, nothing gives a dated deadline a faster lane, and the two maintainers, who cannot hold a Red Team application, were outside it altogether.' }
      ],
      why: 'The interim rule is one sentence doing two jobs, and it is written for neither. For a linked applicant it is the weakest route in the program: Defense Access is granted on a description of defensive work, so an operator who fails the Red Team evidence rows can ask for the lower tier, or return through a sibling organization seven days later, and no written step looks at who else pays with the same instrument. For a legitimate applicant it is the right answer with nobody assigned to give it: the rule says what the applicant receives, and not who decides, by when, or how an organization and the individuals working with it are handled together.',
      risk: 'Output-extraction rings obtain relaxed cyber safeguards through Defense Access by description, one organization at a time. Critical infrastructure operators and maintainers wait in a Red Team queue through disclosure and patch windows for access the page already gives them.',
      proposal: 'Give the interim tier a procedure. Run a linkage check against enforcement records before any tier decision, and let an adverse result end the review at every tier. Require one piece of positive evidence of defensive work before Defense Access is granted as the lower tier. Give the interim decision an owner and the two-day Defense target from the moment a Red Team application is filed, with a one-business-day lane for a dated external deadline. Route by the work described, not the tier ticked. Attach the reapply wait and the decline reason to the linked cluster. Define a joint case for an organization and named individuals.',
      checklist: [

    {

      cases: ['GK-4489', 'GK-4517'],
      clauses: ['LSVP-BAA', 'LSVP-REQ', 'LSVP-RET', 'LSVP-TYPES', 'RET-01', 'RET-02', 'RET-04', 'CVP-ZDR', 'CVP-EVAL', 'RET-BEDROCK', 'RET-ZDR-EFS'],
      written: 'The Life Sciences Verification Program help article says an organization under a Business Associate Agreement cannot receive a grant, and that research without protected health information is eligible in a separate organization that is not under a BAA. It requires a dedicated workspace, phishing-resistant MFA and Workload Identity Federation, and says decisions typically come within about three business days. For zero-retention customers, the Mythos model page says eligible Cyber Verification Program customers who already have zero data retention can keep it for Mythos 5.2 until Enterprise Frontier Safeguards is available. The program help article gives an organization with a data retention exemption zero retention on all program models, for internal use, and the retention article says some organizations receive a notice that they may use Fable with zero retention. For a model called through Amazon Bedrock, the AWS pages put the data retention mode in the customer\'s own AWS account (RET-BEDROCK) and make zero retention there a question for its AWS account team (RET-ZDR-EFS); the desk sees none of that traffic.',
      observed: [
        { caseId: 'GK-4489', text: 'A verified biotech on a HIPAA-ready Enterprise plan asked for a life sciences grant for its protein-design swarm, with a funder milestone on 1 December. The page says what blocks it and names the way through in one clause. It does not say who opens the second organization, how long that takes, what the customer attests to, or what stops health data or a credential from following the team across. The swarm ran on two stored keys shared by up to 180 workers, where the program asks for Workload Identity Federation, and one of those keys also reached the workspace that holds health information.' },
        { caseId: 'GK-4517', text: 'A bank\'s Cyber Fusion Center, enrolled in Defense Access since August under a zero data retention addendum with an exemption on file, saw every Mythos 5.2 request answered by Fable 5.2 from launch. The help article gives an exemption holder zero retention on all program models, so Mythos 5.2 was covered on the page from launch. Nothing owns applying that to the exemption on file, verifying it or delivering the notice: the desk pass that does it had not reached this customer, and the notice had bounced off a contact who left in September. Its automation retried failed calls up to five times and drove the workspace into its rate limit during a live investigation.' },
        { caseId: 'GK-4517', text: 'The same customer\'s disaster-recovery playbooks call Fable 5.2 through Amazon Bedrock, and every call since 9 November fails because a service control policy of its own AWS organization pins the retention mode to none. The mode is the customer\'s to change in its AWS account, and the desk saw only the CloudTrail excerpt the customer sent.' }
      ],
      why: 'Each rule is a gate with its exit described in a subordinate clause. The exit has no owner, no target time, no verification steps and no scope, so the specialist improvises it under time pressure and the customer learns about the gate by hitting it. Both teams qualified. The BAA organization needed the written route out, and the exemption holder needed the written rule applied. In each case the procedure failed, not the policy.',
      risk: 'Verified life sciences customers under a BAA are declined or stalled past funded milestones, or are approved on the wrong organization and put health data under 30-day program retention. Eligible zero-retention customers fall back silently at every model launch, and their automation turns a routing decision into an outage. Each improvised fix sets a different precedent for scope.',
      proposal: 'Write the exits as procedures. For the BAA split: an owner, a five-business-day target, a health-data attestation, a check that no credential or identity reaches both organizations, and the program\'s own requirements (dedicated workspace, phishing-resistant MFA, identity federation) confirmed before the grant goes live. For the retention exemption: verification steps the specialist can run from records, a default scope of the enrolled workspace, a notice that goes to the program\'s security contact and is tracked to delivery, and exemptions applied to a new program model before its launch hour, not after it.',
      checklist: [

        'Approval notices: say that Fable keeps its biology safeguards, that the pipeline must call a program model in the program organization, and whether the work is covered by Standard Use or needs the High-risk Use add-on.',

        'Model launches: apply existing exemptions to the new program model before the launch hour. If the backlog is not zero at launch, publish its size to the queue.',
        'Fallback appeals: check for client retry storms on every appeal and put the fix in the notice.'
      ],
      detections: ['DET-03', 'DET-04']

    {

      written: 'The Life Sciences Verification Program help article requires phishing-resistant MFA for the Claude apps, Workload Identity Federation for the API and a dedicated workspace, and on a Team plan a grant attaches to the whole organization. It says usage is checked against the organization\'s stated scope, and that when activity looks out of scope the admin is notified and has one week to explain, narrow the scope or dispute. The announcement names access compromise, insider threats and agent misuse as the threat models. The launch offers article says a used limit reset cannot be undone. The Cyber Verification Program security requirements write the report within 72 hours for a breach or misuse involving the grant (CVP-SEC-INCIDENT). The duties of 24 hours and 48 hours do not carry that phrase, and no page reaches an incident in another organization or under another program.',
      observed: [

        { caseId: 'GK-4533', text: 'The university that holds Defense Access on a separate Enterprise organization shows no activity from the intruder\'s network, and no page binds its grant to an incident in the lab\'s organization. The desk therefore asked the university\'s security contact, as a request and not a rule, to work to the same times: report within 24 hours and investigate within 48 hours (DESK-XPROG).' },
        { caseId: 'GK-4489', text: 'The protein-design swarm ran up to 180 workers on two stored keys, with no human checkpoint in three of five runs. The program asks for Workload Identity Federation. A grant given to that organization as it stood would have attached to credentials that no single person or workload owns.' }

      why: 'A grant is given to an organization after a review of the organization, and on a Team plan it covers every seat. The pages state what each seat and workload must have. They do not say that anything checks a seat against those requirements when it uses the grant. An intruder needs one seat. Nothing written says what the specialist does in the first hour of a takeover, tells a takeover from a shared credential, or covers the launch offers a stolen seat inherits from its owner.',
      risk: 'A single phished seat in a verified organization gives an outsider program-level access and three limit resets, for as long as it takes someone to read an alert. The available responses are too small (a notice) or too large (suspending the organization or revoking the grant), and the large ones act against the victim and stop verified research.',
      proposal: 'Enforce the written requirements where the grant is used: a seat that does not meet its program\'s MFA requirement, or a workload without a federated identity, cannot use a program model. Add a containment ladder that starts at the credential and climbs only on evidence: token, seat, workspace, organization. Give the specialist a written takeover-or-sharing test built on sign-in history. Alert when a program seat acts outside its program\'s domain, and when a limit reset is followed by a burst from a network the seat has never used.',
      checklist: [

        'Grant go-live: list every seat and workload identity that will use the grant and confirm each meets the written requirements. On a Team plan that is every seat in the organization.',
